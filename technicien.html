<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfect Services - Espace Technicien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0a08;
    --bg-card:#161310;
    --bg-card-2:#1d1914;
    --border:#2e2818;
    --border-soft:#241f16;
    --gold-1:#d4af37;
    --gold-2:#f5d576;
    --gold-deep:#8a6d1f;
    --gold-gradient: linear-gradient(135deg, #b8912e 0%, #f5d576 45%, #d4af37 65%, #8a6d1f 100%);
    --green:#2e7d4f;
    --green-bg:#123420;
    --orange:#c8791a;
    --orange-bg:#3a2610;
    --red:#b23a3a;
    --red-bg:#3a1414;
    --text:#f4f0e6;
    --text-dim:#a89a7a;
    --font-display:'Cormorant Garamond', serif;
    --font-body:'Inter', 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:var(--font-body);
    background:
      radial-gradient(ellipse 700px 400px at 50% -10%, rgba(212,175,55,0.06), transparent),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex; justify-content:center;
  }
  .wrap{ width:100%; max-width:480px; padding:20px 16px; }
  .header{ display:flex; align-items:center; gap:10px; margin-bottom:26px; justify-content:space-between; }
  .header-left{ display:flex; align-items:center; gap:10px; }
  .logo-circle{
    width:42px; height:42px; border-radius:50%; border:1.5px solid var(--gold-1);
    box-shadow:0 0 0 3px rgba(212,175,55,0.08);
    display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--gold-1);
    background:radial-gradient(circle at 30% 30%, #2a2210, #0a0a0a); flex-shrink:0;
  }
  .header h2{ font-family:var(--font-display); font-size:18px; font-weight:700; }
  .header .sub{ font-size:11px; color:var(--text-dim); letter-spacing:.5px; }
  .logout{ font-size:12px; color:var(--text-dim); cursor:pointer; text-decoration:underline; }

  .card{
    background:var(--bg-card); border:1px solid var(--border-soft); border-radius:15px; padding:20px; margin-bottom:16px;
    position:relative; overflow:hidden;
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background:var(--gold-gradient); opacity:.6;
  }
  label{ font-size:12px; color:var(--text-dim); display:block; margin-bottom:6px; }
  input, textarea{
    width:100%; background:var(--bg-card-2); border:1px solid var(--border); color:var(--text);
    padding:12px; border-radius:9px; font-size:15px; font-family:inherit; margin-bottom:14px;
  }

  input:focus, textarea:focus{ outline:none; border-color:var(--gold-1); box-shadow:0 0 0 3px rgba(212,175,55,0.1); }
  .btn{
    width:100%; background:var(--gold-gradient); color:#161207; border:none; padding:15px;
    border-radius:11px; font-weight:700; font-size:15px; cursor:pointer;
    box-shadow:0 4px 16px rgba(212,175,55,0.2); transition:.15s; letter-spacing:.2px;
  }
  .btn:hover{ filter:brightness(1.1); transform:translateY(-1px); }
  .btn-outline{ background:transparent; border:1px solid var(--border); color:var(--text-dim); box-shadow:none; }
  .login-title{ text-align:center; margin-bottom:22px; }
  .login-title h1{ font-family:var(--font-display); font-size:24px; font-weight:700; margin-bottom:4px; }
  .login-title p{ font-size:12px; color:var(--text-dim); letter-spacing:.5px; }
  .error-msg{ color:#f07070; font-size:13px; text-align:center; margin-top:10px; display:none; }

  .inter-card{
    background:var(--bg-card-2); border:1px solid var(--border-soft); border-radius:13px;
    padding:15px; margin-bottom:12px; cursor:pointer; transition:.15s;
  }
  .inter-card:hover{ border-color:var(--gold-deep); transform:translateY(-1px); }
  .inter-card .top{ display:flex; justify-content:space-between; margin-bottom:6px; }
  .inter-card .num{ font-weight:700; font-size:13px; color:var(--gold-2); }
  .inter-card .client{ font-family:var(--font-display); font-size:17px; font-weight:700; margin-bottom:2px; }
  .inter-card .meta{ font-size:12px; color:var(--text-dim); }
  .badge{ padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.2px; }
  .badge.confirmee{ background:var(--green-bg); color:#5fd68a; }
  .badge.en_attente_confirmation{ background:var(--orange-bg); color:#f0a94e; }
  .badge.annulee, .badge.reportee{ background:var(--red-bg); color:#f07070; }
  .badge.terminee, .badge.payee{ background:#1e2a3a; color:#7ab8f0; }
  .empty{ text-align:center; color:#666; padding:30px; font-size:13px; }

  .material-row{ display:flex; gap:8px; margin-bottom:8px; }
  .material-row input{ margin-bottom:0; }
  .material-row button{
    background:var(--red-bg); color:#f07070; border:none; border-radius:6px;
    width:38px; flex-shrink:0; cursor:pointer;
  }
  .add-material-btn{
    background:transparent; border:1px dashed var(--border); color:var(--text-dim);
    padding:10px; border-radius:9px; cursor:pointer; width:100%; font-size:13px; margin-bottom:14px;
  }
  .add-material-btn:hover{ border-color:var(--gold-1); color:var(--gold-2); }
  .checkbox-row{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .checkbox-row input{ width:auto; margin:0; }
  .back-link{ font-size:13px; color:var(--gold-2); cursor:pointer; margin-bottom:14px; display:inline-block; }
  .detail-row{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid #221d14; font-size:13px; }
  .photo-zone{ margin-bottom:14px; }
  .photo-placeholder{
    border:1px dashed var(--border); border-radius:10px; padding:24px;
    text-align:center; color:var(--text-dim); cursor:pointer; font-size:13px; transition:.15s;
  }
  .photo-placeholder:hover{ border-color:var(--gold-1); color:var(--gold-2); background:#161209; }
  .photo-zone img{ width:100%; border-radius:10px; border:1px solid var(--border-soft); display:block; }
  .photo-zone .retake{ font-size:11px; color:var(--text-dim); text-align:center; margin-top:6px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ECRAN CONNEXION -->
  <div id="screen-login">
    <div class="login-title">
      <div class="logo-circle" style="margin:0 auto 14px auto;"><img src="logo-icon.png" alt="Perfect Services" style="width:100%; height:100%; object-fit:cover; border-radius:50%;"></div>
      <h1>Espace Technicien</h1>
      <p>Perfect Services SGI</p>
    </div>
    <div class="card">
      <label>Numéro de téléphone</label>
      <input type="text" id="login-tel" placeholder="Ex: 0709123456">
      <label>Code PIN (4 chiffres)</label>
      <input type="password" id="login-pin" maxlength="4" placeholder="••••">
      <button class="btn" onclick="seConnecter()">Se connecter</button>
      <div class="error-msg" id="login-error">Numéro ou code PIN incorrect.</div>
    </div>
  </div>

  <!-- ECRAN LISTE INTERVENTIONS -->
  <div id="screen-liste" style="display:none;">
    <div class="header">
      <div class="header-left">
        <div class="logo-circle"><img src="logo-icon.png" alt="Perfect Services" style="width:100%; height:100%; object-fit:cover; border-radius:50%;"></div>
        <div>
          <h2 id="tech-nom-affiche">—</h2>
          <div class="sub">Mes interventions</div>
        </div>
      </div>
      <div class="logout" onclick="seDeconnecter()">Déconnexion</div>
    </div>
    <div id="liste-interventions"><div class="empty">Chargement...</div></div>
  </div>

  <!-- ECRAN DETAIL / COMPTE-RENDU -->
  <div id="screen-detail" style="display:none;">
    <span class="back-link" onclick="retourListe()">← Retour à mes interventions</span>
    <div class="card" id="detail-content"></div>
  </div>

</div>

<script type="module">
import { db, collection, query, where, getDocs, doc, updateDoc, onSnapshot } from "./firebase-config.js";

let currentTech = JSON.parse(localStorage.getItem('sgi_technicien') || 'null');
let currentIntervention = null;

function afficherEcran(id){
  ['screen-login','screen-liste','screen-detail'].forEach(s=>{
    document.getElementById(s).style.display = (s === id) ? 'block' : 'none';
  });
}

window.seConnecter = async function(){
  const tel = document.getElementById('login-tel').value.trim();
  const pin = document.getElementById('login-pin').value.trim();
  const errorMsg = document.getElementById('login-error');
  errorMsg.style.display = 'none';

  if(!tel || pin.length !== 4){
    errorMsg.textContent = 'Merci de saisir ton numéro et un code PIN à 4 chiffres.';
    errorMsg.style.display = 'block';
    return;
  }

  const q = query(collection(db, "techniciens"), where("tel", "==", tel), where("pin", "==", pin));
  const snap = await getDocs(q);

  if(snap.empty){
    errorMsg.textContent = 'Numéro ou code PIN incorrect.';
    errorMsg.style.display = 'block';
    return;
  }

  let techData = null;
  snap.forEach(d => techData = { id: d.id, ...d.data() });

  if(techData.actif === false){
    errorMsg.textContent = 'Ton compte a été désactivé. Contacte l\'administrateur.';
    errorMsg.style.display = 'block';
    return;
  }

  currentTech = techData;
  localStorage.setItem('sgi_technicien', JSON.stringify(techData));
  demarrerEspaceTechnicien();
};

window.seDeconnecter = function(){
  localStorage.removeItem('sgi_technicien');
  currentTech = null;
  afficherEcran('screen-login');
};

function labelStatut(s){
  const map = {
    en_attente_confirmation: "En attente confirmation",
    confirmee: "Confirmée — à réaliser",
    reportee: "Reportée",
    annulee: "Annulée",
    terminee: "Terminée",
    payee: "Terminée & payée"
  };
  return map[s] || s;
}

function demarrerEspaceTechnicien(){
  document.getElementById('tech-nom-affiche').textContent = currentTech.nom;
  afficherEcran('screen-liste');

  const q = query(collection(db, "interventions"), where("technicienId", "==", currentTech.id));
  onSnapshot(q, (snap)=>{
    const interventions = [];
    snap.forEach(d => interventions.push({ id: d.id, ...d.data() }));
    interventions.sort((a,b)=> (a.dateRdv||'').localeCompare(b.dateRdv||''));

    const list = document.getElementById('liste-interventions');
    // On ne montre pas les annulées tout en bas, mais on les garde visibles pour info
    if(interventions.length === 0){
      list.innerHTML = '<div class="empty">Aucune intervention assignée pour le moment.</div>';
      return;
    }
    list.innerHTML = interventions.map(i => `
      <div class="inter-card" onclick="ouvrirDetail('${i.id}')">
        <div class="top">
          <span class="num">${i.numero}</span>
          <span class="badge ${i.statut}">${labelStatut(i.statut)}</span>
        </div>
        <div class="client">${i.clientNom}</div>
        <div class="meta">${i.prestationNom} · ${i.dateRdv} à ${i.heureRdv}</div>
        <div class="meta">📍 ${i.clientAdresse || 'Adresse non précisée'}</div>
      </div>
    `).join('');
  });
}

window.ouvrirDetail = async function(id){
  const snap = await getDocs(query(collection(db, "interventions"), where("__name__", "==", id)));
  let data = null;
  snap.forEach(d => data = { id: d.id, ...d.data() });
  if(!data) return;
  currentIntervention = data;
  afficherDetail(data);
  afficherEcran('screen-detail');
};

window.retourListe = function(){
  afficherEcran('screen-liste');
};

let materialCount = 0;
let photoAvantData = null;
let photoApresData = null;

window.addMaterialRow = function(){
  materialCount++;
  const row = document.createElement('div');
  row.className = 'material-row';
  row.id = 'material-' + materialCount;
  row.innerHTML = `<input type="text" placeholder="Ex: Câble RG6 20m" class="material-nom" style="flex:2;"><input type="number" placeholder="Prix FCFA" class="material-prix" style="flex:1;" oninput="updateTotalMateriaux()"><button type="button" onclick="document.getElementById('material-${materialCount}').remove(); updateTotalMateriaux();">✕</button>`;
  document.getElementById('materials-list').appendChild(row);
  updateTotalMateriaux();
};

window.updateTotalMateriaux = function(){
  let total = 0;
  document.querySelectorAll('.material-prix').forEach(inp=>{
    total += parseFloat(inp.value) || 0;
  });
  const el = document.getElementById('total-materiaux');
  if(el) el.textContent = total.toLocaleString('fr-FR') + ' FCFA';
};

// Compresse une image (redimensionnement + qualité JPEG réduite) avant de la stocker,
// pour rester léger même sans connexion très rapide et rester dans les limites gratuites.
function compresserImage(file, callback){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxLargeur = 800;
      const ratio = Math.min(1, maxLargeur / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * ratio;
      canvas.height = img.height * ratio;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const base64 = canvas.toDataURL('image/jpeg', 0.6);
      callback(base64);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

window.chargerPhoto = function(input, type){
  const file = input.files[0];
  if(!file) return;
  compresserImage(file, (base64)=>{
    if(type === 'avant'){ photoAvantData = base64; } else { photoApresData = base64; }
    const preview = document.getElementById('preview-' + type);
    const placeholder = document.getElementById('placeholder-' + type);
    preview.src = base64;
    preview.style.display = 'block';
    placeholder.style.display = 'none';
  });
};


function afficherDetail(data){
  photoAvantData = null;
  photoApresData = null;
  const dejaTermine = ['terminee','payee'].includes(data.statut);
  const annexes = data.travauxAnnexes || [];

  let annexesHtml = '';
  if(annexes.length > 0){
    annexesHtml = annexes.map(a => `<div class="detail-row"><span>${a.nom}</span><span>${a.prix.toLocaleString('fr-FR')} FCFA</span></div>`).join('');
  } else {
    annexesHtml = '<div class="detail-row"><span style="color:#666;">Aucun travaux annexe</span><span></span></div>';
  }

  let encaissementHtml = '';
  if(currentTech.encaissement){
    encaissementHtml = `
      <div class="checkbox-row">
        <input type="checkbox" id="cr-encaisse">
        <label style="margin:0;">J'ai encaissé le solde (${(data.solde||0).toLocaleString('fr-FR')} FCFA) chez le client</label>
      </div>
    `;
  } else {
    encaissementHtml = `<p style="font-size:12px; color:var(--text-dim); margin-bottom:14px;">💡 Tu n'es pas autorisé à encaisser — le solde sera géré directement par l'administrateur.</p>`;
  }

  document.getElementById('detail-content').innerHTML = `
    <div style="margin-bottom:16px;">
      <div style="font-weight:700; font-size:16px; margin-bottom:2px;">${data.numero}</div>
      <span class="badge ${data.statut}">${labelStatut(data.statut)}</span>
    </div>
    <div class="detail-row"><span>Client</span><span>${data.clientNom}</span></div>
    <div class="detail-row"><span>Téléphone</span><span>${data.clientTel}</span></div>
    <div class="detail-row"><span>Adresse</span><span style="text-align:right;">${data.clientAdresse || '—'}</span></div>
    <div class="detail-row"><span>Prestation</span><span>${data.prestationNom}</span></div>
    ${data.prestationPrecision ? `<div class="detail-row"><span>Précision</span><span style="text-align:right;">${data.prestationPrecision}</span></div>` : ''}
    <div class="detail-row"><span>Date / Heure</span><span>${data.dateRdv} à ${data.heureRdv}</span></div>
    <div style="margin:12px 0 4px 0; font-weight:600; font-size:13px; color:var(--gold-1);">Travaux annexes</div>
    ${annexesHtml}
    <div class="detail-row" style="font-weight:700; color:var(--gold-1); font-size:15px; margin-top:8px;"><span>Montant total</span><span>${(data.montantTotal||0).toLocaleString('fr-FR')} FCFA</span></div>
    <div class="detail-row"><span>Solde restant</span><span>${(data.solde||0).toLocaleString('fr-FR')} FCFA</span></div>

    ${dejaTermine ? `
      <div style="margin:20px 0 10px 0; font-family:var(--font-display); font-size:17px; font-weight:700; color:var(--gold-2); border-bottom:1px solid var(--border-soft); padding-bottom:6px;">Compte-rendu enregistré</div>
      ${data.materiauxUtilises && data.materiauxUtilises.length > 0 ? `
        <div style="margin-top:6px;">
          ${data.materiauxUtilises.map(m => `<div class="detail-row"><span>${m.nom || m}</span><span>${m.prix ? m.prix.toLocaleString('fr-FR') + ' FCFA' : '—'}</span></div>`).join('')}
          <div class="detail-row" style="font-weight:700; color:var(--gold-2);"><span>Coût total matériaux</span><span>${(data.coutTotalMateriaux||0).toLocaleString('fr-FR')} FCFA</span></div>
        </div>
      ` : ''}
      ${data.remarquesTechnicien ? `<div class="detail-row"><span>Observations</span><span style="text-align:right;">${data.remarquesTechnicien}</span></div>` : ''}
      ${data.photoAvant ? `<label style="margin-top:12px;">Photo avant</label><img src="${data.photoAvant}" style="width:100%; border-radius:10px; margin-bottom:10px;">` : ''}
      ${data.photoApres ? `<label>Photo après</label><img src="${data.photoApres}" style="width:100%; border-radius:10px;">` : ''}
      <div style="margin-top:16px; padding:14px; background:var(--green-bg); border-radius:10px; text-align:center; color:#5fd68a; font-size:13px;">
        ✅ Cette intervention est clôturée.
      </div>
    ` : `
      <div style="margin:20px 0 10px 0; font-weight:600; font-size:13px; color:var(--gold-1);">Compte-rendu d'intervention</div>
      <label>Matériaux utilisés</label>
      <div id="materials-list"></div>
      <button type="button" class="add-material-btn" onclick="addMaterialRow()">+ Ajouter un matériau utilisé</button>
      <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--text-dim); margin:-6px 0 14px 0; padding:0 2px;">
        <span>Coût total des matériaux utilisés (info, non facturé au client)</span>
        <span id="total-materiaux" style="color:var(--gold-2); font-weight:700;">0 FCFA</span>
      </div>

      <label>Photo AVANT intervention</label>
      <div class="photo-zone" id="zone-avant">
        <input type="file" accept="image/*" capture="environment" id="photo-avant-input" onchange="chargerPhoto(this, 'avant')" style="display:none;">
        <div class="photo-placeholder" onclick="document.getElementById('photo-avant-input').click()" id="placeholder-avant">📷 Prendre une photo AVANT</div>
        <img id="preview-avant" style="display:none;">
      </div>

      <label>Photo APRÈS intervention</label>
      <div class="photo-zone" id="zone-apres">
        <input type="file" accept="image/*" capture="environment" id="photo-apres-input" onchange="chargerPhoto(this, 'apres')" style="display:none;">
        <div class="photo-placeholder" onclick="document.getElementById('photo-apres-input').click()" id="placeholder-apres">📷 Prendre une photo APRÈS</div>
        <img id="preview-apres" style="display:none;">
      </div>

      <label>Observations (optionnel)</label>
      <textarea id="cr-remarques" rows="2" placeholder="Ex: RAS, intervention sans difficulté"></textarea>
      ${encaissementHtml}
      <button class="btn" onclick="terminerIntervention(event)">Marquer comme terminée</button>
    `}
  `;
  materialCount = 0;
}

window.terminerIntervention = async function(evt){
  const materiaux = [];
  const rows = document.querySelectorAll('.material-row');
  rows.forEach(row=>{
    const nom = row.querySelector('.material-nom').value.trim();
    const prix = parseFloat(row.querySelector('.material-prix').value) || 0;
    if(nom) materiaux.push({ nom, prix });
  });
  const coutTotalMateriaux = materiaux.reduce((s,m)=> s + m.prix, 0);
  const remarques = document.getElementById('cr-remarques').value.trim();
  const encaisseCheckbox = document.getElementById('cr-encaisse');
  const soldeEncaisse = encaisseCheckbox ? encaisseCheckbox.checked : false;

  const btn = evt.target;
  btn.disabled = true;
  btn.textContent = "Enregistrement...";

  const payload = {
    statut: soldeEncaisse ? "payee" : "terminee",
    materiauxUtilises: materiaux,
    coutTotalMateriaux: coutTotalMateriaux,
    remarquesTechnicien: remarques,
    soldeEncaisse: soldeEncaisse,
    termineAt: new Date().toISOString()
  };
  if(photoAvantData) payload.photoAvant = photoAvantData;
  if(photoApresData) payload.photoApres = photoApresData;

  try {
    await updateDoc(doc(db, "interventions", currentIntervention.id), payload);
    alert("Compte-rendu enregistré. Merci !");
    afficherEcran('screen-liste');
  } catch(err){
    alert("Erreur lors de l'enregistrement. Vérifie ta connexion et réessaie. Si le problème persiste, les photos sont peut-être trop lourdes.");
    btn.disabled = false;
    btn.textContent = "Marquer comme terminée";
  }
};

// Démarrage : si déjà connecté (session sauvegardée), on saute direct à la liste
if(currentTech){
  demarrerEspaceTechnicien();
} else {
  afficherEcran('screen-login');
}
</script>
</body>
</html>
