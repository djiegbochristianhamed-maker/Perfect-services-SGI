<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfect Services - Confirmation de rendez-vous</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0a08;
    --gold-1:#d4af37;
    --gold-2:#f5d576;
    --gold-deep:#8a6d1f;
    --gold-gradient: linear-gradient(135deg, #b8912e 0%, #f5d576 45%, #d4af37 65%, #8a6d1f 100%);
    --green:#1f8a4c;
    --orange:#c8791a;
    --red:#b23a3a;
    --text:#f4f0e6;
    --text-dim:#a89a7a;
    --font-display:'Cormorant Garamond', serif;
    --font-body:'Inter', 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:var(--font-body);
    background:
      radial-gradient(ellipse 700px 400px at 50% -10%, rgba(212,175,55,0.08), transparent),
      var(--bg);
    color:var(--text);
    display:flex; justify-content:center; align-items:flex-start;
    min-height:100vh; padding:24px 16px;
  }
  .phone{
    width:100%; max-width:400px;
  }
  .header{
    display:flex; align-items:center; gap:10px; margin-bottom:22px;
  }
  .logo-circle{
    width:42px; height:42px; border-radius:50%;
    border:1.5px solid var(--gold-1);
    box-shadow:0 0 0 3px rgba(212,175,55,0.08);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:18px; color:var(--gold-1);
    background:radial-gradient(circle at 30% 30%, #2a2210, #0a0a0a);
    flex-shrink:0;
  }
  .header h2{ font-family:var(--font-display); font-size:19px; font-weight:700; letter-spacing:.3px; }
  .greeting{ text-align:center; margin-bottom:22px; }
  .greeting .hello{ font-size:13px; color:var(--text-dim); letter-spacing:.5px; }
  .greeting .name{
    font-family:var(--font-display); font-size:26px; font-weight:700;
    background:var(--gold-gradient); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .card{
    background:#faf7f0; color:#1a1a1a; border-radius:16px; padding:22px; margin-bottom:20px;
    box-shadow:0 12px 40px rgba(0,0,0,0.4);
  }
  .card .titre{
    font-family:var(--font-display); color:#a0741a; font-weight:700; font-size:16px; margin-bottom:16px;
    display:flex; align-items:center; gap:6px; letter-spacing:.3px;
  }
  .row{
    display:flex; justify-content:space-between; padding:9px 0;
    border-bottom:1px solid #ece5d3; font-size:13px; gap:12px;
  }
  .row:last-child{ border-bottom:none; }
  .row .k{ color:#8a7a55; flex-shrink:0; }
  .row .v{ font-weight:600; text-align:right; }
  .annexe-box{
    background:#fbf3da; border:1px solid #e8cf8a; border-radius:10px;
    padding:12px 14px; margin:12px 0; font-size:13px;
  }
  .annexe-box .titre-annexe{ font-weight:700; color:#9a6f14; margin-bottom:6px; }
  .annexe-line{ display:flex; justify-content:space-between; padding:2px 0; }
  .montant-box{
    background:linear-gradient(135deg, #fdf6e3, #f7ead0); border-radius:12px; padding:16px; text-align:center; margin-top:16px;
    border:1px solid #e8cf8a;
  }
  .montant-box .lbl{ font-size:11px; color:#9a6f14; font-weight:700; letter-spacing:.6px; }
  .montant-box .val{ font-family:var(--font-display); font-size:30px; font-weight:700; color:#8a5f0f; }
  .question{ text-align:center; margin:22px 0 16px 0; }
  .question h3{ font-family:var(--font-display); font-size:20px; font-weight:700; }
  .question p{ font-size:12px; color:var(--text-dim); margin-top:4px; }
  .btn{
    width:100%; padding:17px; border-radius:12px; border:none;
    font-size:15px; font-weight:700; cursor:pointer; margin-bottom:12px;
    display:flex; align-items:center; justify-content:center; gap:10px;
    color:#fff; transition:.15s; letter-spacing:.2px;
  }
  .btn:hover{ transform:translateY(-1px); filter:brightness(1.08); }
  .btn .sub{ display:block; font-weight:400; font-size:11px; opacity:.9; }
  .btn-confirmer{ background:linear-gradient(135deg, #2ea363, #1f8a4c); box-shadow:0 6px 20px rgba(31,138,76,0.3); }
  .btn-reporter{ background:linear-gradient(135deg, #d68c2e, #c8791a); box-shadow:0 6px 20px rgba(200,121,26,0.3); }
  .btn-annuler{ background:linear-gradient(135deg, #c24747, #b23a3a); box-shadow:0 6px 20px rgba(178,58,58,0.3); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .footnote{
    text-align:center; font-size:11px; color:var(--text-dim); margin-top:14px;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .state-box{
    text-align:center; padding:40px 20px; font-size:14px; color:var(--text-dim);
  }
  .result-box{
    text-align:center; padding:36px 20px; background:linear-gradient(135deg, #161310, #0f0d0a);
    border-radius:16px; border:1px solid #2e2818;
  }
  .result-box .emoji{ font-size:42px; margin-bottom:12px; }
  .result-box h3{ font-family:var(--font-display); font-size:22px; margin-bottom:8px; }
  .result-box p{ font-size:13px; color:var(--text-dim); }
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="logo-circle"><img src="logo-icon.png" alt="Perfect Services" style="width:100%; height:100%; object-fit:cover; border-radius:50%;"></div>
    <h2>Perfect Services TNT</h2>
  </div>

  <div id="content">
    <div class="state-box">Chargement de votre intervention...</div>
  </div>
</div>

<script type="module">
import { db, doc, getDoc, updateDoc } from "./firebase-config.js";

const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const content = document.getElementById('content');

function labelStatutFinal(s){
  const map = {
    confirmee: { emoji:'✅', titre:'Rendez-vous confirmé', msg:'Merci ! Nous vous attendons à la date et l\'heure prévues.' },
    reportee: { emoji:'🕐', titre:'Demande de report envoyée', msg:'Nous allons vous recontacter pour fixer une nouvelle date.' },
    annulee: { emoji:'❌', titre:'Rendez-vous annulé', msg:'N\'hésitez pas à nous recontacter si vous souhaitez reprogrammer.' }
  };
  return map[s];
}

async function repondre(statut){
  await updateDoc(doc(db, "interventions", id), {
    statut,
    confirmedAt: new Date().toISOString()
  });
  const info = labelStatutFinal(statut);
  content.innerHTML = `
    <div class="result-box">
      <div class="emoji">${info.emoji}</div>
      <h3>${info.titre}</h3>
      <p>${info.msg}</p>
    </div>
  `;
}
window.repondre = repondre;

async function charger(){
  if(!id){
    content.innerHTML = '<div class="state-box">Lien invalide ou incomplet.</div>';
    return;
  }
  const snap = await getDoc(doc(db, "interventions", id));
  if(!snap.exists()){
    content.innerHTML = '<div class="state-box">Cette intervention est introuvable.</div>';
    return;
  }
  const data = snap.data();

  // Si déjà répondu, afficher l'état final directement
  if(['confirmee','reportee','annulee'].includes(data.statut) && data.confirmedAt){
    const info = labelStatutFinal(data.statut);
    content.innerHTML = `
      <div class="result-box">
        <div class="emoji">${info.emoji}</div>
        <h3>${info.titre}</h3>
        <p>${info.msg}</p>
      </div>
    `;
    return;
  }

  const annexes = data.travauxAnnexes || [];
  let annexeHtml = '';
  if(annexes.length > 0){
    annexeHtml = `
      <div class="annexe-box">
        <div class="titre-annexe">⚠️ Travaux annexes prévus</div>
        ${annexes.map(a => `<div class="annexe-line"><span>${a.nom}</span><span>+${(a.prix||0).toLocaleString('fr-FR')} FCFA</span></div>`).join('')}
      </div>
    `;
  } else {
    annexeHtml = `
      <div class="annexe-box" style="background:#f4f4f4; border-color:#ddd;">
        <div class="titre-annexe" style="color:#666;">ℹ️ Aucun travaux annexe prévu</div>
      </div>
    `;
  }

  content.innerHTML = `
    <div class="greeting">
      <div class="hello">Bonjour</div>
      <div class="name">${data.clientNom || ''}</div>
    </div>

    <div class="card">
      <div class="titre">📋 RÉSUMÉ DE L'INTERVENTION</div>
      <div class="row"><span class="k">N° Intervention</span><span class="v">${data.numero || '—'}</span></div>
      <div class="row"><span class="k">Prestation</span><span class="v">${data.prestationNom || '—'}${data.prestationPrecision ? ' <br><span style=\'font-weight:400; color:#888; font-size:11px;\'>' + data.prestationPrecision + '</span>' : ''}</span></div>
      <div class="row"><span class="k">Date</span><span class="v">${data.dateRdv || '—'}</span></div>
      <div class="row"><span class="k">Heure</span><span class="v">${data.heureRdv || '—'}</span></div>
      <div class="row"><span class="k">Adresse</span><span class="v">${data.clientAdresse || '—'}</span></div>

      ${annexeHtml}

      <div class="montant-box">
        <div class="lbl">MONTANT TOTAL CONVENU</div>
        <div class="val">${(data.montantTotal||0).toLocaleString('fr-FR')} FCFA</div>
      </div>
      <div style="text-align:center; font-size:11px; color:#a87a10; margin-top:8px;">
        NB / Une validation de ${(data.acompte||0).toLocaleString('fr-FR')} FCFA (20%) est requise pour finaliser le créneau.
      </div>
    </div>

    <div class="question">
      <h3>Que souhaitez-vous faire ?</h3>
      <p>Merci de sélectionner une option</p>
    </div>

    <button class="btn btn-confirmer" onclick="repondre('confirmee')">
      ✅&nbsp; CONFIRMER<span class="sub">Je confirme mon rendez-vous</span>
    </button>
    <button class="btn btn-reporter" onclick="repondre('reportee')">
      🕐&nbsp; REPORTER<span class="sub">Je souhaite changer la date / heure</span>
    </button>
    <button class="btn btn-annuler" onclick="repondre('annulee')">
      ❌&nbsp; ANNULER<span class="sub">Je ne peux plus honorer ce rendez-vous</span>
    </button>

    <div class="footnote">🛡️ Quelle que soit votre réponse, nous vous enverrons la confirmation par WhatsApp.</div>
  `;
}
charger();
</script>
</body>
</html>
